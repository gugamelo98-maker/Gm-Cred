*{margin:0;padding:0;box-sizing:border-box}

.cta{position:absolute;left:80px;right:80px;bottom:70px;background:#f5c518;color:#111;border-radius:999px;height:124px;display:flex;align-items:center;justify-content:center;gap:24px;font-size:58px;font-weight:900}

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assinatura de demonstração</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
<style>
:root{--bg:#e9eef4;--card:#fff;--tx:#1d2733;--tx2:#5b6878;--verde:#16a36a}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;padding:16px}
.card{background:var(--card);border-radius:18px;box-shadow:0 10px 30px rgba(30,50,80,.1);padding:28px;max-width:420px;width:100%;text-align:center}
.ico{font-size:40px}
h1{font-size:20px;margin:10px 0 8px}
p{color:var(--tx2);font-size:14.5px;line-height:1.55;margin-bottom:10px}
a{display:inline-block;margin-top:10px;background:var(--verde);color:#fff;text-decoration:none;font-weight:700;border-radius:12px;padding:11px 18px}
</style>
</head>
<body>
<div class="card">
  <div class="ico">✍️</div>
  <h1>Assinatura de demonstração</h1>
  <p>Este é o link de teste que a Formalização envia no chat de teste. Com um cliente real, aqui abriria o link de formalização da V8 (conferir dados, selfie e assinatura).</p>
  <p>Para seguir o teste, volte ao chat e use o botão <b>Simular assinatura</b>.</p>
  <a href="chat.html">Voltar ao chat de teste</a>
</div>
</body>
</html>

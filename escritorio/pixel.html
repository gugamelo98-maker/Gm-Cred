<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Escritório CLT &amp; FGTS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0614;color:#ddd;}
.px{font-family:'Press Start 2P',monospace;}

.top{position:fixed;top:0;left:0;right:0;z-index:60;height:48px;display:flex;align-items:center;gap:8px;padding:0 8px;background:#0d0820;border-bottom:2px solid #2a0050;}
.logo{font-family:'Press Start 2P',monospace;font-size:8px;color:#ffcc00;text-shadow:2px 2px #ff6600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
.hstats{display:flex;gap:8px;flex-shrink:0;}
.hsc{display:flex;flex-direction:column;align-items:center;gap:2px;}
.hsv{font-family:'Press Start 2P',monospace;font-size:8px;}
.hsl{font-size:5px;color:#666;font-family:'Press Start 2P',monospace;}
.conn{font-family:'Press Start 2P',monospace;font-size:6px;padding:4px 6px;border:1px solid #333;cursor:pointer;flex-shrink:0;background:#120428;color:#888;}
.conn.on{color:#00ff88;border-color:#00ff8855;}
.conn.off{color:#ff4466;border-color:#ff446655;}
.conn.demo{color:#ffcc00;border-color:#ffcc0055;}

.sidebar{position:fixed;left:0;top:48px;bottom:0;z-index:55;width:56px;background:#090416;border-right:2px solid #1a0035;display:flex;flex-direction:column;gap:3px;padding:5px 4px;overflow-y:auto;}
.sb-item{width:48px;min-height:48px;border-radius:4px;cursor:pointer;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:2px solid transparent;touch-action:manipulation;-webkit-tap-highlight-color:transparent;position:relative;}
.sb-item:hover,.sb-item.active{border-color:var(--c);background:rgba(255,255,255,.05);}
.sb-dot{width:10px;height:10px;border-radius:50%;background:var(--c);}
.sb-lbl{font-size:5px;color:#777;font-family:'Press Start 2P',monospace;text-align:center;line-height:1.4;}
.sb-item.active .sb-lbl{color:var(--c);}
.sb-cnt{font-size:7px;font-family:'Press Start 2P',monospace;color:#fff;}
.sb-alert{position:absolute;top:2px;right:2px;font-size:6px;font-family:'Press Start 2P',monospace;color:#fff;background:#ff2244;border-radius:6px;padding:1px 3px;}
.sb-sep{height:1px;background:#1a0035;margin:1px 0;flex-shrink:0;}

canvas{position:fixed;top:48px;left:56px;right:0;bottom:0;image-rendering:pixelated;z-index:1;}

.ticker{position:fixed;left:56px;right:0;bottom:0;z-index:50;height:26px;background:rgba(8,3,26,.92);border-top:1px solid #2a0050;display:flex;align-items:center;gap:8px;padding:0 10px;overflow:hidden;cursor:pointer;}
.ticker .tk-l{font-family:'Press Start 2P',monospace;font-size:6px;color:#ffcc00;flex-shrink:0;}
.ticker .tk-t{font-family:'Press Start 2P',monospace;font-size:6px;color:#bbb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.dash{position:fixed;top:48px;left:56px;right:0;bottom:0;z-index:70;background:#08031a;display:none;overflow-y:auto;padding:12px 14px 24px;}
.dash.open{display:block;}
.dh{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.dh-title{font-family:'Press Start 2P',monospace;font-size:11px;flex:1;}
.dh-sub{font-size:7px;color:#666;font-family:'Press Start 2P',monospace;flex-basis:100%;margin-top:2px;line-height:1.6;}
.dh-close{font-family:'Press Start 2P',monospace;font-size:7px;color:#fff;background:#200840;border:2px solid #6633bb;padding:6px 9px;cursor:pointer;touch-action:manipulation;flex-shrink:0;}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:7px;margin-bottom:12px;}
.kpi{background:#100228;border-radius:5px;padding:10px 9px;border:1px solid #1e0040;}
.kpi-v{font-family:'Press Start 2P',monospace;font-size:14px;margin-bottom:5px;}
.kpi-l{font-size:6px;color:#666;font-family:'Press Start 2P',monospace;line-height:1.6;}
.sec-title{font-family:'Press Start 2P',monospace;font-size:7px;color:#555;margin:12px 0 7px;letter-spacing:1px;}
.list{display:flex;flex-direction:column;gap:5px;}
.row{background:#100228;border-radius:4px;padding:8px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-left:3px solid var(--c);}
.row .a{font-family:'Press Start 2P',monospace;font-size:7px;color:#ddd;flex:1;min-width:90px;line-height:1.5;}
.row .b{font-family:'Press Start 2P',monospace;font-size:6px;color:#888;}
.row .warn{color:#ff4466;}
.empty{font-family:'Press Start 2P',monospace;font-size:6px;color:#3a1866;padding:12px 0;line-height:1.8;}
.ev-time{font-family:'Press Start 2P',monospace;font-size:6px;color:#555;flex-shrink:0;}

.tip{position:fixed;z-index:200;pointer-events:none;display:none;background:#08031a;border:2px solid #ffcc00;padding:8px 10px;min-width:170px;max-width:240px;font-family:'Press Start 2P',monospace;}
.tn{font-size:7px;color:#ffcc00;margin-bottom:5px;line-height:1.5;}
.tr2{display:flex;justify-content:space-between;font-size:6px;color:#666;margin-top:3px;gap:8px;}
.tv{color:#ddd;text-align:right;}

.banner{position:fixed;left:50%;top:60px;transform:translateX(-50%);z-index:80;font-family:'Press Start 2P',monospace;font-size:6px;color:#ffcc00;background:#1a0a00;border:1px solid #ffcc0066;padding:6px 10px;display:none;line-height:1.7;text-align:center;max-width:90vw;}
</style>
</head>
<body>

<header class="top">
  <span class="logo" id="logoTxt">★ CLT &amp; FGTS</span>
  <div class="hstats">
    <div class="hsc"><span class="hsv" style="color:#00ccff" id="kAnd">0</span><span class="hsl">ATENDENDO</span></div>
    <div class="hsc"><span class="hsv" style="color:#ff6644" id="kEnt">0</span><span class="hsl">ENTRARAM</span></div>
    <div class="hsc"><span class="hsv" style="color:#ffcc00" id="kFec">0</span><span class="hsl">FECHARAM</span></div>
    <div class="hsc"><span class="hsv" style="color:#cc44ff" id="kCom">R$0</span><span class="hsl">COMISSÃO</span></div>
    <div class="hsc"><span class="hsv" style="color:#ff2244" id="kPar">0</span><span class="hsl">PARADOS</span></div>
  </div>
  <button class="conn" id="connBtn" onclick="toggleDemo()" title="Alternar modo demonstração">...</button>
</header>

<nav class="sidebar" id="sidebar"></nav>
<canvas id="c"></canvas>
<div class="ticker" id="ticker" onclick="openFeed()"><span class="tk-l">▶ AO VIVO</span><span class="tk-t" id="tickerTxt">aguardando eventos...</span></div>
<div class="banner" id="banner"></div>

<div class="dash" id="dash">
  <div class="dh">
    <span class="dh-title" id="dashTitle">SETOR</span>
    <button class="dh-close" onclick="closeDash()">✕ FECHAR</button>
    <span class="dh-sub" id="dashSub"></span>
  </div>
  <div id="dashContent"></div>
</div>
<div class="tip" id="tip"></div>

<script>
// ═════════════ CONFIG ═════════════
const QS = new URLSearchParams(location.search);
const ENDPOINT = QS.get('api') || 'https://rarelookingorca-n8n.cloudfy.live/webhook/escritorio/estado';
const POLL_MS = 5000;
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
let demo = QS.get('demo')==='1' || lsGet('escritorio_demo')==='1';

const STATUS_LABEL={disparado:'DISPARADO',respondeu:'RESPONDEU',cpf_ok:'CPF ENVIADO',simulado:'SIMULADO',proposta:'PROPOSTA',negociando:'NEGOCIANDO',fechou:'FECHOU',link_env:'LINK ENVIADO',assinou:'ASSINOU',upsell:'UPSELL',parou:'DESISTIU'};
const AG_COLOR={trabalhando:'#00cc44',livre:'#334455',pausado:'#ffaa00'};
const AG_LABEL={trabalhando:'TRABALHANDO',livre:'LIVRE',pausado:'PAUSADO'};

// ═════════════ ESTADO ═════════════
let estado = {setores:[],agentes:[],leads:[],eventos:[],resumo:{},numeros:[],funil:[]};
let conectado = false, ultimoErro = null;

function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function brl(v){v=Number(v)||0;return v>=1000?'R$'+(v/1000).toFixed(v>=10000?0:1).replace('.',',')+'k':'R$'+Math.round(v);}
function brlFull(v){return v==null?'—':'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function minDesde(iso){return iso?Math.max(0,Math.round((Date.now()-new Date(iso).getTime())/60000)):0;}
function tempo(m){return m<60?m+'min':m<1440?Math.floor(m/60)+'h'+String(m%60).padStart(2,'0'):Math.floor(m/1440)+'d';}
function hora(iso){const d=new Date(iso);return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
function setorById(id){return estado.setores.find(s=>s.id===id);}
function hash(n){n=(n|0)*2654435761;return (n>>>0)%997;}

// ═════════════ MODO DEMO (dados fictícios no mesmo formato da API) ═════════════
const DEMO_SETORES=[
 {id:'recepcao',nome:'Recepção',descricao:'Recebe o cliente, entende o interesse e pede o CPF',cor:'#ff6644',ordem:1,sla_minutos:30},
 {id:'simulacao',nome:'Simulação',descricao:'Consulta V8 Digital e Hub Crédito e monta a melhor oferta',cor:'#ffcc00',ordem:2,sla_minutos:15},
 {id:'vendas',nome:'Vendas',descricao:'Apresenta a oferta, contorna objeções e decide CLT ou FGTS',cor:'#00ccff',ordem:3,sla_minutos:120},
 {id:'formalizacao',nome:'Formalização',descricao:'Envia o link de assinatura e cobra quem não assinou',cor:'#44ff88',ordem:4,sla_minutos:1440},
 {id:'posvenda',nome:'Pós-venda',descricao:'Confirma liberação, oferece FGTS (upsell) e pede indicação',cor:'#cc44ff',ordem:5,sla_minutos:4320},
 {id:'gerente',nome:'Gerente',descricao:'Supervisiona todos os setores e resgata clientes parados',cor:'#aaaaaa',ordem:6,sla_minutos:null}];
const DEMO_AG=[['Ana','recepcao','Recepcionista'],['Bruno','simulacao','Analista de crédito'],['Carla','vendas','Consultora de vendas'],['Diego','formalizacao','Especialista em contratos'],['Elisa','posvenda','Relacionamento'],['Fernando','gerente','Gerente geral']];
const DEMO_NOMES=['João Silva','Maria Santos','Pedro Oliveira','Carla Costa','Roberto Lima','Juliana Ferreira','Marcelo Souza','Patricia Alves','Fernando Rocha','Beatriz Mendes','André Cardoso','Camila Ribeiro','Rodrigo Nunes','Larissa Pinto','Leandro Castro','Amanda Correia','Fabio Dias','Renata Barbosa'];
const FLUXO=[['recepcao','respondeu'],['recepcao','cpf_ok'],['simulacao','simulado'],['vendas','proposta'],['vendas','negociando'],['formalizacao','fechou'],['formalizacao','link_env'],['posvenda','assinou']];
let demoState=null, demoSeq=0;
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function demoInit(){
  const agentes=DEMO_AG.map((a,i)=>({id:i+1,nome:a[0],setor_id:a[1],papel:a[2],status:'livre',avatar:{},fechados:0,em_andamento:0,receita_total:0}));
  const leads=[];const eventos=[];
  for(let i=0;i<12;i++){const st=rnd(0,FLUXO.length-1);leads.push(demoLead(st,rnd(1,200)));}
  demoState={setores:DEMO_SETORES,agentes,leads,eventos,numeros:[{id:1,apelido:'Atendimento 1',status_conexao:'conectado',leads_ativos:0},{id:2,apelido:'Atendimento 2',status_conexao:'conectado',leads_ativos:0}],fechados:0,comissao:0,entraram:12};
}
function demoLead(st,min){
  const prod=Math.random()<.65?'clt':'fgts';const valor=prod==='clt'?rnd(9000,28000):rnd(3000,11000);
  return{id:++demoSeq,nome:DEMO_NOMES[demoSeq%DEMO_NOMES.length],telefone:'55489'+rnd(10000000,99999999),setor_id:FLUXO[st][0],status:FLUXO[st][1],etapa:st,produto:prod,banco:Math.random()<.5?'v8digital':'hubcredito',valor,comissao:Math.round(valor*.03),numero_id:rnd(1,2),aguardando:Math.random()<.5?'cliente':'agente',entrou_setor_em:new Date(Date.now()-min*60000).toISOString(),ultima_interacao:new Date(Date.now()-min*30000).toISOString()};
}
function demoEvento(l,tipo,desc,de,para){demoState.eventos.unshift({id:Date.now()+Math.random(),lead_id:l.id,tipo,descricao:desc,setor_origem:de,setor_destino:para,criado_em:new Date().toISOString()});demoState.eventos=demoState.eventos.slice(0,40);}
function demoTick(){
  const D=demoState;
  if(Math.random()<.35){const l=demoLead(0,0);D.leads.push(l);D.entraram++;demoEvento(l,'entrou',l.nome+' entrou na Recepção',null,'recepcao');}
  for(let k=0;k<rnd(1,2);k++){
    const l=D.leads[rnd(0,D.leads.length-1)];if(!l)break;
    if(Math.random()<.06&&l.etapa<4){D.leads=D.leads.filter(x=>x!==l);demoEvento(l,'perdeu',l.nome+' desistiu ('+STATUS_LABEL[l.status]+')',l.setor_id,l.setor_id);continue;}
    if(l.etapa>=FLUXO.length-1){if(Math.random()<.3){D.leads=D.leads.filter(x=>x!==l);demoEvento(l,'status',l.nome+' concluiu o pós-venda',l.setor_id,null);}continue;}
    const de=l.setor_id;l.etapa++;l.setor_id=FLUXO[l.etapa][0];l.status=FLUXO[l.etapa][1];l.ultima_interacao=new Date().toISOString();l.aguardando=Math.random()<.5?'cliente':'agente';
    if(de!==l.setor_id){l.entrou_setor_em=new Date().toISOString();demoEvento(l,'mudou_setor',l.nome+' foi de '+setNome(de)+' para '+setNome(l.setor_id),de,l.setor_id);}
    if(l.status==='assinou'){D.fechados++;D.comissao+=l.comissao;const ag=D.agentes.find(a=>a.setor_id==='formalizacao');ag.fechados++;ag.receita_total+=l.comissao;demoEvento(l,'fechou',l.nome+' assinou! ('+brlFull(l.valor)+')',l.setor_id,l.setor_id);}
  }
  D.agentes.forEach(a=>{const n=D.leads.filter(l=>l.setor_id===a.setor_id).length;a.status=a.setor_id==='gerente'?(D.leads.some(l=>parado(l))?'trabalhando':'livre'):(n>0&&Math.random()<.8?'trabalhando':'livre');a.em_andamento=n;});
  return demoSnapshot();
}
function setNome(id){const s=DEMO_SETORES.find(x=>x.id===id);return s?s.nome:id;}
function parado(l){const s=(estado.setores.length?estado.setores:DEMO_SETORES).find(x=>x.id===l.setor_id);return !!(s&&s.sla_minutos&&minDesde(l.entrou_setor_em)>s.sla_minutos);}
function demoSnapshot(){
  const D=demoState;const leads=D.leads.map(l=>({...l,parado:parado(l)}));
  const setores=D.setores.map(s=>({...s,leads_ativos:leads.filter(l=>l.setor_id===s.id).length,leads_parados:leads.filter(l=>l.setor_id===s.id&&l.parado).length,agentes:1,agentes_trabalhando:D.agentes.filter(a=>a.setor_id===s.id&&a.status==='trabalhando').length}));
  return{gerado_em:new Date().toISOString(),setores,agentes:D.agentes.map(a=>({...a})),leads,eventos:D.eventos,numeros:D.numeros,funil:[],
    resumo:{entraram_hoje:D.entraram,em_andamento:leads.length,fecharam_hoje:D.fechados,comissao_hoje:D.comissao,volume_hoje:0,parados:leads.filter(l=>l.parado).length,perdidos_hoje:0}};
}

// ═════════════ BUSCA DE DADOS ═════════════
async function atualizar(){
  if(demo){if(!demoState)demoInit();aplicarEstado(demoTick());setConn();return;}
  try{
    const r=await fetch(ENDPOINT,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    conectado=true;ultimoErro=null;aplicarEstado(j);
  }catch(e){conectado=false;ultimoErro=e.message;}
  setConn();
}
function setConn(){
  const b=document.getElementById('connBtn'),bn=document.getElementById('banner');
  if(demo){b.className='conn demo';b.textContent='● DEMO';bn.style.display='block';bn.innerHTML='MODO DEMONSTRAÇÃO — dados fictícios.<br>Toque em DEMO para voltar aos dados reais.';return;}
  b.className='conn '+(conectado?'on':'off');b.textContent=conectado?'● AO VIVO':'● OFFLINE';
  if(!conectado){bn.style.display='block';bn.innerHTML='Sem conexão com o servidor ('+esc(ultimoErro||'...')+').<br>Tentando de novo a cada 5s.';}
  else if(!estado.leads.length){bn.style.display='block';bn.innerHTML='Escritório aberto, mas sem clientes no momento.<br>Os agentes aparecem aqui assim que começarem a atender.';}
  else bn.style.display='none';
}
function toggleDemo(){demo=!demo;lsSet('escritorio_demo',demo?'1':'0');demoState=null;leadSprites.clear();atualizar();}

let ultimoEventoId=null;
function aplicarEstado(j){
  estado={setores:j.setores||[],agentes:j.agentes||[],leads:j.leads||[],eventos:j.eventos||[],resumo:j.resumo||{},numeros:j.numeros||[],funil:j.funil||[]};
  const R=estado.resumo;
  document.getElementById('kAnd').textContent=R.em_andamento??0;
  document.getElementById('kEnt').textContent=R.entraram_hoje??0;
  document.getElementById('kFec').textContent=R.fecharam_hoje??0;
  document.getElementById('kCom').textContent=brl(R.comissao_hoje);
  document.getElementById('kPar').textContent=R.parados??0;
  const ev=estado.eventos[0];
  if(ev){document.getElementById('tickerTxt').textContent=hora(ev.criado_em)+' · '+ev.descricao;
    if(ultimoEventoId!==null&&ev.id!==ultimoEventoId&&ev.tipo==='fechou')celebrar(ev);ultimoEventoId=ev.id;}
  sincronizarSprites();buildSidebar();
  if(dashAberto)renderDash();
}

// ═════════════ SIDEBAR ═════════════
function buildSidebar(){
  const nav=document.getElementById('sidebar');nav.innerHTML='';
  estado.setores.forEach(s=>{
    const el=document.createElement('div');el.className='sb-item'+(dashAberto===s.id?' active':'');
    el.style.setProperty('--c',s.cor);el.style.background=s.cor+'10';
    el.innerHTML=`<div class="sb-dot"></div><div class="sb-cnt">${s.id==='gerente'?(estado.resumo.parados??0):s.leads_ativos}</div><div class="sb-lbl">${esc(s.nome.substring(0,6))}</div>${s.leads_parados>0?`<span class="sb-alert">${s.leads_parados}</span>`:''}`;
    el.onclick=()=>openDash(s.id);nav.appendChild(el);
    const sep=document.createElement('div');sep.className='sb-sep';nav.appendChild(sep);
  });
  const f=document.createElement('div');f.className='sb-item'+(dashAberto==='feed'?' active':'');f.style.setProperty('--c','#ffcc00');
  f.innerHTML='<div class="sb-cnt">📜</div><div class="sb-lbl">FEED</div>';f.onclick=openFeed;nav.appendChild(f);
  const n=document.createElement('div');n.className='sb-item'+(dashAberto==='numeros'?' active':'');n.style.setProperty('--c','#00ff88');
  n.innerHTML=`<div class="sb-cnt">📱${estado.numeros.length}</div><div class="sb-lbl">NÚMEROS</div>`;n.onclick=()=>{dashAberto='numeros';renderDash();abrir();};nav.appendChild(n);
}

// ═════════════ PAINÉIS ═════════════
let dashAberto=null;
function abrir(){document.getElementById('dash').classList.add('open');buildSidebar();}
function openDash(id){dashAberto=id;renderDash();abrir();}
function openFeed(){dashAberto='feed';renderDash();abrir();}
function closeDash(){document.getElementById('dash').classList.remove('open');dashAberto=null;buildSidebar();}
function leadRow(l,cor){
  const s=setorById(l.setor_id);const m=minDesde(l.entrou_setor_em);
  return `<div class="row" style="--c:${cor||(s?s.cor:'#666')}">
    <div class="a">${esc(l.nome||l.telefone||'Cliente #'+l.id)}</div>
    <div class="b" style="color:${l.produto==='fgts'?'#cc44ff':'#ffcc00'}">${(l.produto||'—').toUpperCase()}</div>
    <div class="b">${STATUS_LABEL[l.status]||esc(l.status)}</div>
    <div class="b">${l.valor?brl(l.valor):'—'}</div>
    <div class="b ${l.parado?'warn':''}">${l.parado?'⚠ ':''}${tempo(m)}</div>
    <div class="b">${l.aguardando==='cliente'?'⏳ cliente':l.aguardando==='humano'?'🙋 humano':'🤖 agente'}</div>
  </div>`;
}
function renderDash(){
  const T=document.getElementById('dashTitle'),S=document.getElementById('dashSub'),C=document.getElementById('dashContent');
  if(dashAberto==='feed'){
    T.textContent='FEED AO VIVO';T.style.color='#ffcc00';S.textContent='Tudo o que está acontecendo na empresa, em ordem.';
    C.innerHTML=estado.eventos.length?'<div class="list">'+estado.eventos.map(e=>{const s=setorById(e.setor_destino||e.setor_origem);
      const cor=e.tipo==='fechou'?'#ffcc00':e.tipo==='perdeu'?'#ff2244':(s?s.cor:'#666');
      return `<div class="row" style="--c:${cor}"><span class="ev-time">${hora(e.criado_em)}</span><div class="a">${esc(e.descricao)}</div></div>`;}).join('')+'</div>'
      :'<div class="empty">Nenhum evento ainda.<br>Quando um cliente entrar, aparece aqui.</div>';return;}
  if(dashAberto==='numeros'){
    T.textContent='NÚMEROS DE ATENDIMENTO';T.style.color='#00ff88';S.textContent='Portas de entrada do WhatsApp. Todos os agentes atendem em todos os números.';
    C.innerHTML=estado.numeros.length?'<div class="list">'+estado.numeros.map(n=>{const cor={conectado:'#00ff88',desconectado:'#ff4466',bloqueado:'#ff2244'}[n.status_conexao]||'#666';
      return `<div class="row" style="--c:${cor}"><div class="a">${esc(n.apelido||n.telefone||'Número '+n.id)}</div><div class="b">${esc(n.telefone||'')}</div><div class="b" style="color:${cor}">${esc((n.status_conexao||'').toUpperCase())}</div><div class="b">${n.leads_ativos||0} clientes</div></div>`;}).join('')+'</div>'
      :'<div class="empty">Nenhum número cadastrado ainda.<br>Os números entram na tabela credito.numeros.</div>';return;}
  const s=setorById(dashAberto);if(!s)return closeDash();
  T.textContent=s.nome.toUpperCase();T.style.color=s.cor;S.textContent=s.descricao+(s.sla_minutos?' · prazo: '+tempo(s.sla_minutos):'');
  const ags=estado.agentes.filter(a=>a.setor_id===s.id);
  const leads=s.id==='gerente'?estado.leads.filter(l=>l.parado):estado.leads.filter(l=>l.setor_id===s.id);
  const kpis=s.id==='gerente'
    ?[[estado.resumo.em_andamento??0,'CLIENTES NA EMPRESA'],[estado.resumo.parados??0,'PARADOS ALÉM DO PRAZO'],[estado.resumo.fecharam_hoje??0,'FECHARAM HOJE'],[brl(estado.resumo.comissao_hoje),'COMISSÃO HOJE']]
    :[[s.leads_ativos,'CLIENTES AQUI'],[s.leads_parados,'PARADOS'],[leads.filter(l=>l.aguardando==='cliente').length,'ESPERANDO CLIENTE'],[s.agentes_trabalhando+'/'+s.agentes,'AGENTES ATIVOS']];
  C.innerHTML=`<div class="kpi-row">${kpis.map(k=>`<div class="kpi"><div class="kpi-v" style="color:${s.cor}">${k[0]}</div><div class="kpi-l">${k[1]}</div></div>`).join('')}</div>
    <div class="sec-title">▸ AGENTES</div>
    <div class="list">${ags.map(a=>`<div class="row" style="--c:${s.cor}"><div class="a">${esc(a.nome)} · ${esc(a.papel||'')}</div><div class="b" style="color:${AG_COLOR[a.status]||'#666'}">${AG_LABEL[a.status]||esc(a.status)}</div><div class="b">${a.fechados||0} fechados</div></div>`).join('')||'<div class="empty">Nenhum agente neste setor.</div>'}</div>
    <div class="sec-title">▸ ${s.id==='gerente'?'CLIENTES PARADOS (PRECISAM DE ATENÇÃO)':'CLIENTES AQUI AGORA'} (${leads.length})</div>
    <div class="list">${leads.length?leads.map(l=>leadRow(l)).join(''):'<div class="empty">'+(s.id==='gerente'?'Nenhum cliente parado. Tudo em dia!':'Nenhum cliente neste setor agora.')+'</div>'}</div>`;
}

// ═════════════ CANVAS ═════════════
const cv=document.getElementById('c');const ctx=cv.getContext('2d');
let W,H,S=2;
const TW=32,TH=16,WALL_H=44,WALL_HOME=20,ROOM=5,GAP=2;
function resize(){const dpr=1;W=cv.width=Math.floor((window.innerWidth-56)*dpr);H=cv.height=Math.floor((window.innerHeight-48-26)*dpr);cv.style.height=(window.innerHeight-48-26)+'px';}
resize();window.addEventListener('resize',()=>{resize();layoutMudou=true;});
let layoutMudou=true;

function iso(c,r,ox,oy){return{x:ox+(c-r)*TW/2,y:oy+(c+r)*TH/2};}
function poly(pts,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(pts[0][0]*S,pts[0][1]*S);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0]*S,pts[i][1]*S);ctx.closePath();ctx.fill();}
function shade(hex,a){const n=parseInt(hex.replace('#',''),16);return'#'+[n>>16,n>>8&255,n&255].map(c=>Math.min(255,Math.max(0,c+a)).toString(16).padStart(2,'0')).join('');}
function drawTile(x,y,col){poly([[x,y],[x+TW/2,y+TH/2],[x,y+TH],[x-TW/2,y+TH/2]],col);ctx.strokeStyle='rgba(0,0,0,.2)';ctx.lineWidth=S*.4;ctx.beginPath();ctx.moveTo(x*S,(y+TH)*S);ctx.lineTo((x+TW/2)*S,(y+TH/2)*S);ctx.stroke();}
function drawWall(x,y,fc,sc,wh){wh=wh||WALL_H;poly([[x,y-wh],[x+TW/2,y+TH/2-wh],[x+TW/2,y+TH/2],[x,y]],fc);poly([[x,y-wh],[x,y],[x-TW/2,y+TH/2],[x-TW/2,y+TH/2-wh]],sc);poly([[x-TW/2,y+TH/2-wh],[x,y-wh],[x+TW/2,y+TH/2-wh],[x,y+TH-wh]],'#e0d0b0');}
function drawDesk(x,y,cor,on){
  poly([[x,y-10],[x+13,y-6],[x,y-2],[x-13,y-6]],'#c8a870');poly([[x-13,y-6],[x-13,y-2],[x,y+2],[x,y-2]],'#a08050');poly([[x+13,y-6],[x+13,y-2],[x,y+2],[x,y-2]],'#886840');
  ctx.fillStyle='#0a0a14';ctx.fillRect((x+1)*S,(y-22)*S,10*S,9*S);ctx.fillStyle=on?'#002a10':'#001200';ctx.fillRect((x+2)*S,(y-21)*S,8*S,7*S);
  if(on){ctx.fillStyle=cor;for(let i=0;i<3;i++)ctx.fillRect((x+3)*S,(y-20+i*2)*S,(3+((tick+i*7)%5))*S,Math.max(1,S*.8));}
}
function drawPlant(x,y){ctx.fillStyle='#7a3810';ctx.fillRect((x-3)*S,(y-5)*S,6*S,5*S);ctx.fillStyle='#1a5c1a';ctx.beginPath();ctx.arc(x*S,(y-11)*S,6*S,0,Math.PI*2);ctx.fill();ctx.fillStyle='#3aaa3a';ctx.beginPath();ctx.arc((x+3)*S,(y-12)*S,5*S,0,Math.PI*2);ctx.fill();ctx.fillStyle='#44cc44';ctx.beginPath();ctx.arc(x*S,(y-15)*S,3*S,0,Math.PI*2);ctx.fill();}
function label(txt,x,y,cor,fs,bg){ctx.font=`bold ${fs}px Arial,sans-serif`;ctx.textAlign='center';const w=ctx.measureText(txt).width;ctx.fillStyle=bg||'rgba(0,0,0,.88)';ctx.fillRect(x-w/2-5,y-fs,w+10,fs+6);if(cor){ctx.strokeStyle=cor;ctx.lineWidth=Math.max(1.5,S*.8);ctx.strokeRect(x-w/2-5,y-fs,w+10,fs+6);}ctx.fillStyle=cor||'#fff';ctx.fillText(txt,x,y);return w;}

// boneco: tipo 'agente' (com setor) ou 'cliente'
function drawPessoa(p,opts){
  const ax=Math.round(p.x),ay=Math.round(p.y),sc=opts.escala||1;
  const bob=p.walking?Math.sin(p.t*.25)*1.5:Math.sin(p.t*.05)*.6;const jmp=p.celebT>0?-Math.abs(Math.sin(p.celebT/5))*7:0;const by=ay+bob+jmp;
  const roupa=opts.roupa,escura=shade(roupa,-50),pele=opts.pele||'#ffcc99',cab=opts.cabelo||'#3b2219';
  const R=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect((ax+x*sc)*S,(by+y*sc)*S,w*sc*S,h*sc*S);};
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(ax*S,(ay+1)*S,5*sc*S,2*sc*S,0,0,Math.PI*2);ctx.fill();
  const ls=p.walking?Math.sin(p.t*.25)*2:0;
  R(-2,-2,2,4,'#334');R(1,-2+ls/sc,2,4,'#334');R(-3,-8,7,6,roupa);R(-2,-7,5,2,escura);
  const ar=p.walking?Math.sin(p.t*.25)*2:0;R(-5,-8+ar/sc,2,4,roupa);R(4,-8-ar/sc,2,4,roupa);
  R(-1,-9,3,2,pele);R(-3,-16,7,7,pele);R(-3,-16,7,2,cab);R(-4,-16,1,3,cab);R(-2,-13,1,1,'#180800');R(2,-13,1,1,'#180800');
  if(opts.nome){label(opts.nome,ax*S,(by-19*sc)*S,opts.corNome||roupa,Math.max(9,S*4.5));}
  if(opts.statusCor){ctx.fillStyle=opts.statusCor;ctx.beginPath();ctx.arc((ax+6*sc)*S,(by-15*sc)*S,Math.max(2.5,S*1.6),0,Math.PI*2);ctx.fill();}
  if(opts.alerta){const fs=Math.max(9,S*5);ctx.font=`bold ${fs}px Arial`;ctx.textAlign='center';ctx.fillStyle='#ff2244';ctx.fillRect(ax*S-fs*.45,(by-18*sc)*S-fs*1.25-(Math.sin(tick*.15)*2),fs*.9,fs*1.1);ctx.fillStyle='#fff';ctx.fillText('!',ax*S,(by-18*sc)*S-fs*.35-(Math.sin(tick*.15)*2));}
}

// ── geometria ──
let geo={home:null,det:null};
// Paisagem: grade nos eixos isométricos (diagonal). Retrato: grade alinhada à tela (2 colunas).
function calcHome(){
  const n=Math.max(1,estado.setores.length),retrato=W<H*0.9;
  const G0={modo:retrato?'tela':'iso',cols:Math.min(retrato?(H/W>1.9?1:2):3,n)};
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for(let i=0;i<n;i++){const o=salaOff(i,G0);[[0,0],[ROOM,0],[0,ROOM],[ROOM,ROOM]].forEach(([dc,dr])=>{const p=iso(o.c+dc,o.r+dr,0,0);minX=Math.min(minX,p.x-TW/2);maxX=Math.max(maxX,p.x+TW/2);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);});}
  const top=WALL_HOME+34;
  const s=Math.max(.3,Math.min(W/(maxX-minX),H/(maxY-minY+top+10))*.95);
  const sw=W/s,sh=H/s;
  return{...G0,S:s,ox:sw/2-(minX+maxX)/2,oy:top+(sh-top-(maxY-minY))/2-minY};
}
function salaOff(idx,G){
  const k=ROOM+GAP,col=idx%G.cols,row=Math.floor(idx/G.cols);
  if(G.modo==='tela'){const kk=Math.ceil(k*0.75);return{c:(row+col)*kk,r:(row-col)*kk};}
  return{c:col*k,r:row*k};
}
// vagas para clientes dentro da sala (exclui mesa do agente em 1,1 e planta em 4,4)
const VAGAS=[];for(let r=0;r<ROOM;r++)for(let c=0;c<ROOM;c++){if(!((c===1&&r===1)||(c===ROOM-1&&r===ROOM-1)||(c===1&&r===2)))VAGAS.push({c,r});}
function posCliente(setorId,slot,G){
  const idx=estado.setores.findIndex(s=>s.id===setorId);if(idx<0)return null;
  const o=salaOff(idx,G);const v=VAGAS[slot%VAGAS.length];
  const p=iso(o.c+v.c,o.r+v.r,G.ox,G.oy);return{x:p.x+((slot*7)%5-2),y:p.y+TH*.5};
}
function posAgente(setorId,G){const idx=estado.setores.findIndex(s=>s.id===setorId);const o=salaOff(idx,G);const p=iso(o.c+1,o.r+2,G.ox,G.oy);return{x:p.x,y:p.y+TH*.5};}

// ── sprites dos clientes (persistem entre atualizações para animar a caminhada) ──
const leadSprites=new Map();
function sincronizarSprites(){
  const G=calcHome();geo.home=G;
  const vivos=new Set();const ocup={};
  estado.leads.forEach(l=>{
    vivos.add(l.id);ocup[l.setor_id]=(ocup[l.setor_id]||0)+1;
    const slot=(hash(l.id)+ocup[l.setor_id])%VAGAS.length;
    const alvo=posCliente(l.setor_id,slot,G);if(!alvo)return;
    let sp=leadSprites.get(l.id);
    if(!sp){const ent=posCliente('recepcao',0,G)||alvo;sp={x:ent.x,y:ent.y,t:hash(l.id),walking:false,celebT:0,setor:null};leadSprites.set(l.id,sp);}
    if(sp.setor!==l.setor_id||layoutMudou){sp.tx=alvo.x;sp.ty=alvo.y;sp.walking=true;sp.setor=l.setor_id;}
    sp.lead=l;
  });
  for(const [id,sp] of leadSprites){if(!vivos.has(id))leadSprites.delete(id);}
  layoutMudou=false;
}
function celebrar(ev){const sp=leadSprites.get(ev.lead_id);if(sp)sp.celebT=80;confete=90;}
let confete=0,tick=0,vista='home',hits=[];

function desenharHome(){
  const G=calcHome();geo.home=G;S=G.S;if(layoutMudou)sincronizarSprites();
  ctx.fillStyle='#080310';ctx.fillRect(0,0,W,H);hits=[];
  // desenha as salas de trás para frente (profundidade isométrica = c + r)
  const ordem=estado.setores.map((s,idx)=>({s,idx,o:salaOff(idx,G)})).sort((a,b)=>(a.o.c+a.o.r)-(b.o.c+b.o.r)||a.o.c-b.o.c);
  ordem.forEach(({s,idx,o})=>{
    const itens=[];
    const f1=shade(s.cor,-150),f2=shade(s.cor,-165);
    for(let r=0;r<ROOM;r++)for(let c=0;c<ROOM;c++){const p=iso(o.c+c,o.r+r,G.ox,G.oy);drawTile(p.x,p.y,((c+r)%2===0)?f1:f2);}
    for(let c=0;c<ROOM;c++){const p=iso(o.c+c,o.r,G.ox,G.oy);drawWall(p.x,p.y,shade(s.cor,-70),shade(s.cor,-95),WALL_HOME);}
    for(let r=1;r<ROOM;r++){const p=iso(o.c,o.r+r,G.ox,G.oy);drawWall(p.x,p.y,shade(s.cor,-70),shade(s.cor,-95),WALL_HOME);}
    const ag=estado.agentes.find(a=>a.setor_id===s.id);
    const dk=iso(o.c+1,o.r+1,G.ox,G.oy);itens.push({d:dk.y,f:()=>drawDesk(dk.x,dk.y+TH/2,s.cor,ag&&ag.status==='trabalhando')});
    const pl=iso(o.c+ROOM-1,o.r+ROOM-1,G.ox,G.oy);itens.push({d:pl.y,f:()=>drawPlant(pl.x,pl.y+TH/2)});
    if(ag){const pa=posAgente(s.id,G);const sp=agSprite(ag,pa);itens.push({d:sp.y,f:()=>drawPessoa(sp,{roupa:s.cor,pele:ag.avatar&&ag.avatar.pele,cabelo:ag.avatar&&ag.avatar.cabelo,nome:ag.nome,statusCor:AG_COLOR[ag.status]})});}
    const tl=iso(o.c,o.r,G.ox,G.oy),br=iso(o.c+ROOM-1,o.r+ROOM-1,G.ox,G.oy),tr2=iso(o.c+ROOM-1,o.r,G.ox,G.oy),bl=iso(o.c,o.r+ROOM-1,G.ox,G.oy);
    hits.push({tipo:'sala',s,minX:(bl.x-TW/2)*S,maxX:(tr2.x+TW/2)*S,minY:(tl.y-WALL_HOME-20)*S,maxY:(br.y+TH)*S});
    s._placa=iso(o.c+ROOM/2-.5,o.r,G.ox,G.oy);
    for(const sp of leadSprites.values()){if(sp.setor===s.id)itens.push({d:sp.y,f:()=>drawPessoa(sp,{roupa:sp.lead.parado?'#aa4455':'#7788aa',escala:.8,alerta:sp.lead.parado})});}
    itens.sort((a,b)=>a.d-b.d).forEach(i=>i.f());
  });
  estado.setores.forEach(s=>{
    const p=s._placa;const fs=Math.max(9,Math.min(14,S*5));const y=(p.y-WALL_HOME-6)*S;label(s.nome.toUpperCase(),p.x*S,y,s.cor,fs);
    const txt=s.id==='gerente'?`${estado.resumo.parados??0} parados`:`${s.leads_ativos} clientes${s.leads_parados?' · ⚠'+s.leads_parados:''}`;
    label(txt,p.x*S,y+fs+7,s.leads_parados?'#ff4466':null,Math.max(8,Math.min(11,S*3.6)),'rgba(0,0,0,.7)');
  });
  if(!estado.setores.length){ctx.font="10px 'Press Start 2P',monospace";ctx.textAlign='center';ctx.fillStyle='#553388';ctx.fillText(conectado||demo?'carregando escritório...':'conectando...',W/2,H/2);}
}
const agSprites=new Map();
function agSprite(ag,pos){let sp=agSprites.get(ag.id);if(!sp){sp={x:pos.x,y:pos.y,t:ag.id*13,walking:false,celebT:0};agSprites.set(ag.id,sp);}sp.x=pos.x;sp.y=pos.y;return sp;}

// ── vista detalhada de um setor ──
let setorVista=null;const DC=7,DR=6;
function desenharDetalhe(){
  const s=setorById(setorVista);if(!s){vista='home';return;}
  const fw=W/((DC+DR)*TW/2),fh=H/((DC+DR)*TH/2+WALL_H+20);S=Math.max(.35,Math.min(fw,fh)*.95);
  const sw=W/S,sh=H/S,gh=(DC+DR)*TH/2,ox=sw/2+(DR-DC)*TW/4,oy=WALL_H+10+(sh-WALL_H-10-gh)/2;
  ctx.fillStyle='#080310';ctx.fillRect(0,0,W,H);hits=[];
  const f1=shade(s.cor,-150),f2=shade(s.cor,-165);
  for(let r=0;r<DR;r++)for(let c=0;c<DC;c++){const p=iso(c,r,ox,oy);drawTile(p.x,p.y,((c+r)%2===0)?f1:f2);}
  for(let c=0;c<DC;c++){const p=iso(c,0,ox,oy);drawWall(p.x,p.y,shade(s.cor,-70),shade(s.cor,-95));}
  for(let r=1;r<DR;r++){const p=iso(0,r,ox,oy);drawWall(p.x,p.y,shade(s.cor,-70),shade(s.cor,-95));}
  const itens=[];const ag=estado.agentes.find(a=>a.setor_id===s.id);
  const dk=iso(2,1,ox,oy);itens.push({d:dk.y,f:()=>drawDesk(dk.x,dk.y+TH/2,s.cor,ag&&ag.status==='trabalhando')});
  [[DC-1,0],[DC-1,DR-1]].forEach(([c,r])=>{const p=iso(c,r,ox,oy);itens.push({d:p.y,f:()=>drawPlant(p.x,p.y+TH/2)});});
  if(ag){const p=iso(2,2,ox,oy);const sp=agSprite(ag,{x:p.x,y:p.y+TH/2});itens.push({d:sp.y,f:()=>drawPessoa(sp,{roupa:s.cor,pele:ag.avatar&&ag.avatar.pele,cabelo:ag.avatar&&ag.avatar.cabelo,nome:ag.nome+' · '+(AG_LABEL[ag.status]||''),statusCor:AG_COLOR[ag.status]})});
    hits.push({tipo:'agente',ag,s,x:p.x*S,y:(p.y)*S});}
  const leads=s.id==='gerente'?estado.leads.filter(l=>l.parado):estado.leads.filter(l=>l.setor_id===s.id);
  const vagas=[];for(let r=1;r<DR;r++)for(let c=1;c<DC;c++){if(!((c===2&&(r===1||r===2))))vagas.push({c,r});}
  leads.slice(0,vagas.length).forEach((l,i)=>{
    const v=vagas[i];const p=iso(v.c,v.r,ox,oy);
    let sp=detSprites.get(l.id);if(!sp){sp={x:p.x,y:p.y+TH/2,t:hash(l.id),walking:false,celebT:0};detSprites.set(l.id,sp);}
    sp.x=p.x;sp.y=p.y+TH/2;
    const nome=(l.nome||'Cliente').split(' ')[0];
    itens.push({d:sp.y,f:()=>drawPessoa(sp,{roupa:l.parado?'#aa4455':'#7788aa',nome,corNome:l.parado?'#ff4466':'#aabbcc',alerta:l.parado})});
    hits.push({tipo:'lead',l,x:sp.x*S,y:(sp.y-8)*S});
  });
  itens.sort((a,b)=>a.d-b.d).forEach(i=>i.f());
  const pl=iso(DC/2-.5,0,ox,oy);label(s.nome.toUpperCase(),pl.x*S,(pl.y-WALL_H*.7)*S,s.cor,Math.max(12,S*6.5));
  if(leads.length>vagas.length)label('+'+(leads.length-vagas.length)+' clientes',W/2,H-60,s.cor,12);
  if(!leads.length)label(s.id==='gerente'?'Nenhum cliente parado':'Sala vazia no momento',W/2,H/2+40,null,12,'rgba(0,0,0,.6)');
  desenharVoltar(s.cor);
}
const detSprites=new Map();
let voltarRect={x:0,y:0,w:0,h:0};
function desenharVoltar(cor){
  const fs=Math.max(11,Math.min(15,W/30));ctx.font=`bold ${fs}px Arial,sans-serif`;const t='◀ VOLTAR';const w=ctx.measureText(t).width+32,h=fs+18,x=(W-w)/2,y=H-h-10;
  voltarRect={x,y,w,h};ctx.fillStyle='#150330';ctx.fillRect(x,y,w,h);ctx.strokeStyle=cor;ctx.lineWidth=2;ctx.strokeRect(x,y,w,h);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(t,x+w/2,y+h/2+fs/3);
}

// ── animação ──
function passo(){
  for(const sp of leadSprites.values()){sp.t++;if(sp.celebT>0)sp.celebT--;
    if(sp.walking&&sp.tx!=null){const dx=sp.tx-sp.x,dy=sp.ty-sp.y,d=Math.hypot(dx,dy);if(d<.8){sp.x=sp.tx;sp.y=sp.ty;sp.walking=false;}else{const v=Math.min(1.6,.5+d/60);sp.x+=dx/d*v;sp.y+=dy/d*v;}}}
  for(const sp of agSprites.values())sp.t++;for(const sp of detSprites.values())sp.t++;
}
function desenharConfete(){if(confete<=0)return;confete--;for(let i=0;i<30;i++){ctx.fillStyle=['#ffcc00','#ff6644','#44ff88','#00ccff','#cc44ff'][i%5];ctx.fillRect(Math.random()*W,Math.random()*H*(1-confete/90)+0,4,4);}
  label('🎉 CONTRATO ASSINADO!',W/2,40,'#ffcc00',14);}
function loop(){requestAnimationFrame(loop);tick++;passo();if(vista==='home')desenharHome();else desenharDetalhe();desenharConfete();}

// ── interação ──
const tip=document.getElementById('tip');
function mostrarTip(html,cor,sx,sy){tip.innerHTML=html;tip.style.borderColor=cor;let x=sx+12,y=sy-20;if(x+250>innerWidth)x=sx-250;if(y+200>innerHeight)y=innerHeight-204;tip.style.left=x+'px';tip.style.top=y+'px';tip.style.display='block';}
function clique(mx,my,sx,sy){
  tip.style.display='none';
  if(vista!=='home'){
    const b=voltarRect;if(mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h){vista='home';document.getElementById('logoTxt').textContent='★ CLT & FGTS';detSprites.clear();return;}
    for(const h of hits){
      if(Math.abs(mx-h.x)<14*S&&Math.abs(my-h.y)<18*S){
        if(h.tipo==='lead'){const l=h.l,st=setorById(l.setor_id);
          mostrarTip(`<div class="tn">${esc(l.nome||'Cliente #'+l.id)}</div>
            <div class="tr2"><span>SETOR</span><span class="tv" style="color:${st?st.cor:'#fff'}">${esc(st?st.nome:l.setor_id)}</span></div>
            <div class="tr2"><span>ETAPA</span><span class="tv">${STATUS_LABEL[l.status]||esc(l.status)}</span></div>
            <div class="tr2"><span>PRODUTO</span><span class="tv">${esc((l.produto||'—').toUpperCase())}</span></div>
            <div class="tr2"><span>VALOR</span><span class="tv">${brlFull(l.valor)}</span></div>
            <div class="tr2"><span>NO SETOR HÁ</span><span class="tv" style="color:${l.parado?'#ff4466':'#ddd'}">${tempo(minDesde(l.entrou_setor_em))}${l.parado?' ⚠':''}</span></div>
            <div class="tr2"><span>AGUARDANDO</span><span class="tv">${esc(l.aguardando||'—')}</span></div>`,st?st.cor:'#ffcc00',sx,sy);return;}
        if(h.tipo==='agente'){const a=h.ag;
          mostrarTip(`<div class="tn">${esc(a.nome)} · ${esc(h.s.nome)}</div>
            <div class="tr2"><span>FUNÇÃO</span><span class="tv">${esc(a.papel||'')}</span></div>
            <div class="tr2"><span>STATUS</span><span class="tv" style="color:${AG_COLOR[a.status]}">${AG_LABEL[a.status]||esc(a.status)}</span></div>
            <div class="tr2"><span>ATENDENDO</span><span class="tv">${a.em_andamento||0}</span></div>
            <div class="tr2"><span>FECHADOS</span><span class="tv">${a.fechados||0}</span></div>`,h.s.cor,sx,sy);return;}
      }
    }
    return;
  }
  for(const h of hits){if(h.tipo==='sala'&&mx>=h.minX&&mx<=h.maxX&&my>=h.minY&&my<=h.maxY){vista='setor';setorVista=h.s.id;document.getElementById('logoTxt').textContent='★ '+h.s.nome.toUpperCase();return;}}
}
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect();clique(e.clientX-r.left,e.clientY-r.top,e.clientX,e.clientY);});
cv.addEventListener('touchend',e=>{e.preventDefault();const t=e.changedTouches[0],r=cv.getBoundingClientRect();clique(t.clientX-r.left,t.clientY-r.top,t.clientX,t.clientY);},{passive:false});

// ── início ──
atualizar();setInterval(atualizar,POLL_MS);loop();
</script>
</body>
</html>
